<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaveri </title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #0b2a5b 0%, #1c6fa8 45%, #d9eef5 100%);
      min-height: 100vh;
      color: #0b2a5b;
      padding: 2rem 1rem;
    }
    .wrap {
      max-width: 960px; margin: 0 auto;
      background: rgba(255,255,255,0.95);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      display: grid; grid-template-columns: 300px 1fr;
    }
    .cover { background: #0b2a5b; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .cover img { width: 100%; max-width: 260px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .content { padding: 2rem; }
    h1 { font-size: 2.6rem; letter-spacing: 1px; }
    .sub { font-family: system-ui, sans-serif; color: #1c6fa8; margin: .3rem 0 1.5rem; }
    ul { list-style: none; display: grid; gap: .6rem; }
    a.item {
      display: flex; justify-content: space-between; align-items: center;
      padding: .85rem 1.1rem; border-radius: 10px;
      background: #eef6fb; color: #0b2a5b; text-decoration: none;
      font-family: system-ui, sans-serif; font-weight: 600;
      border: 1px solid #cfe4f1; transition: background .2s, transform .2s;
    }
    a.item:hover { background: #d4ebf7; transform: translateX(4px); }
    a.item span { font-weight: 400; font-size: .85rem; color: #1c6fa8; }
    footer { text-align: center; color: #fff; font-family: system-ui, sans-serif; font-size: .85rem; margin-top: 1.5rem; opacity: .85; }
    @media (max-width: 720px) {
      .wrap { grid-template-columns: 1fr; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="cover">
      <img src="https://www.flipkart.com/ncert-class-9-kaveri/p/itmacff663e99f5a" alt="Kaveri – Textbook of English for Grade 9 cover" />
    </div>
    <div class="content">
      <h1>Kaveri</h1>
      <p class="sub">Textbook of English for Grade 9 — read or download chapters (PDF)</p>
      <ul>
        <li><a class="item" href="iebe1ps.pdf" target="_blank" rel="noopener">Prelims &amp; Contents <span>PDF ↗</span></a></li>
        <li><a class="item" href="https://ncert.nic.in/textbook/pdf/iebe101.pdf" target="_blank" rel="noopener">Unit 2 <span>PDF ↗</span></a></li>
        <li><a class="item" href="https://ncert.nic.in/textbook/pdf/iebe103.pdf" target="_blank" rel="noopener">Unit 3 <span>PDF ↗</span></a></li>
        <li><a class="item" href="https://ncert.nic.in/textbook/pdf/iebe104.pdf" target="_blank" rel="noopener">Unit 4 <span>PDF ↗</span></a></li>
        <li><a class="item" href="https://ncert.nic.in/textbook/pdf/iebe105.pdf" target="_blank" rel="noopener">Unit 5 <span>PDF ↗</span></a></li>
        <li><a class="item" href="https://ncert.nic.in/textbook/pdf/iebe106.pdf" target="_blank" rel="noopener">Unit 6 <span>PDF ↗</span></a></li>
        <li><a class="item" href="https://ncert.nic.in/textbook/pdf/iebe107.pdf" target="_blank" rel="noopener">Unit 7 <span>PDF ↗</span></a></li>
        <li><a class="item" href="https://ncert.nic.in/textbook/pdf/iebe108.pdf" target="_blank" rel="noopener">Unit 8 <span>PDF ↗</span></a></li>
        <li><a class="item" href="https://ncert.nic.in/textbook/pdf/iebe1a1.pdf" target="_blank" rel="noopener">Appendix <span>PDF ↗</span></a></li>
      </ul>
    </div>
  </main>
  <footer>Kaveri · Grade 9 English</footer>
</body>
</html>
